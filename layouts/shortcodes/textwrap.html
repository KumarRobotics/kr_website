
<article style="margin-bottom: 2rem; overflow: hidden;">
  <style>
    @media (max-width: 700px) {
      .textwrap-img {
        float: none !important;
        display: block;
        margin: 0 auto 1rem auto !important;
        max-width: 100% !important;
      }
    }
  </style>

  <img 
    src="{{ .Get "image" }}" 
    alt="{{ .Get "alt" }}" 
    class="textwrap-img"
    style="float: left; max-width: 400px; height: auto; margin: 0 3rem 1rem 0;"
  >

  <div style="line-height: 1.5;">
    {{ .Inner | markdownify }}
  </div>
</article>
