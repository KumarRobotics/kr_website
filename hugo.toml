[module]
    # Explicit mounts for the theme: declaring any mount replaces the
    # theme's default mounts, so all needed dirs are listed. excludeFiles
    # prunes unused theme demo/stock images from the build output.
    [[module.imports]]
        path = 'hugo-universal-theme'
        [[module.imports.mounts]]
            source = 'archetypes'
            target = 'archetypes'
        [[module.imports.mounts]]
            source = 'i18n'
            target = 'i18n'
        [[module.imports.mounts]]
            source = 'layouts'
            target = 'layouts'
        [[module.imports.mounts]]
            source = 'static'
            target = 'static'
            # Prune unused theme demo/stock images with "! " negation globs
            # (files setting, Hugo >=0.153). The space after "!" is
            # required, and negations must precede the "**" catch-all.
            files = [
                "! img/banner2.jpg",
                "! img/banner.jpg",
                "! img/basketsquare.jpg",
                "! img/blog2.jpg",
